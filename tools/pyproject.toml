[project]
name = "specgarage"
version = "0.1.0"
description = "Tools for ingesting and improving automotive spec markdown (CLI: sg)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
sg = "specgarage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specgarage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
