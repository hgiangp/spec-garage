# Registry of spec files. `code` is the permanent prefix of every section ID (<CODE>-<NNNN>, see D2):
# it never changes, even when a new revision of the spec arrives with a new date in its file name.
#
# File name pattern: <doc_no>_<lang>_(<title>)_<yymmdd>
#   source:  the Word→md output, copied under sources/<CODE>/ with its original name
#   images:  the image folder that came with the conversion (fill in the real folder name)

specs:
  - code: WRN
    doc_no: 7820ZXXXXG000
    lang: E
    title: Warning
    date: 2026-02-20
    source: sources/WRN/7820ZXXXXG000_E_(Warning)_260220.md
    images: null  # TODO: sources/WRN/<image folder>

  - code: EWA
    doc_no: 7820ZXXXXS000
    lang: E
    title: EnlargeWA
    date: 2026-02-20
    source: sources/EWA/7820ZXXXXS000_E_(EnlargeWA)_260220.md
    images: null  # TODO

  - code: LIN
